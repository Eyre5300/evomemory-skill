[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "evomemory-sync"
version = "0.2.3"
description = "EvoMemory Hub sync: LangChain AgentMiddleware + CLI search/setup"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "langchain>=1.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "httpx>=0.26.0",
    "requests>=2.28.0",
    "urllib3>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["evomemory_sync"]
